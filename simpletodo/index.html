<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Simple to-do list</title>
	<style>
		*{
			box-sizing:border-box;
		}
		
		body{
			background-color: burlywood;
			display : flex;
			flex-direction  :column;
			align-items : center;
			min-height: 100vh;
		}
		#heading{
			text-align: center;
			background-color: chocolate;
			width: 100%;
			margin: 0;
			padding: 12px 0;
			border-radius: 8px 8px 0 0;
		}
		.done{
			text-decoration: line-through;
			opacity: 0.5;
		}
		.container{
			border:2px solid black;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			width:85%;
			border-radius: 8px;
		}
		label{
			color:saddlebrown;
			align-self:flex-start;
			margin-top: 16px;
			margin-left:16px;
			font-size:18px;
			font-weight:600;
			opacity: 0.8; 
		}
		#input-row{
			display: flex;
			gap: 8px;
			padding: 16px;
			width:100%;
			margin-top: 12px;
		}
		#btn{
			border: none;
			color: white;
			background-color: chocolate;
			border-radius: 8px;
			padding: 8px 12px;
			cursor:pointer;
		}

		#userInput{
			flex: 1;
			border: none;
			border-radius: 8px;
			padding: 8px 12px;
		}
		
		#list{
			width:100%;
			padding : 0 16px 16px;
			list-style: none;
			margin: 0;
			display: flex;
			flex-direction: column;
		}
		.list-items{
			color: black;
			background-color:chocolate;
			border-radius: 8px;
			padding: 8px 12px;
			display: flex;
			flex-direction: row;
			cursor: pointer;
			margin-bottom:6px;
		}
		.del-button{
			border: none;
			color: white;
			background-color: red;
			cursor: pointer;
			border-radius: 8px;
			padding: 8px 12px;
			margin-left: auto;
		}
	</style>
</head>
<body>
	
	<div class="container">
		<h1 id="heading">Todo list</h1>
		<label for="userInput">Enter your activity:</label>
		<div id="input-row">
			
			<input type="text" id="userInput"placeholder= 'e.g. live match today'>
			<button id="btn">Add</button>
		</div>
		<ul id="list">
			<!-- list items get appended	 -->
		</ul>
	</div>
	<script src="script.js"></script>
</body>
</html>
